name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Next 16 requires Node >= 20.9 and the Dockerfiles all run node:20-alpine,
        # so 18.x was dropped rather than kept as a leg nothing ships on.
        node-version: [20.x, 22.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Setup pnpm
      # No version pinned on purpose: the action reads `packageManager` from
      # package.json, so CI and everyone's machine install the same pnpm and the
      # lockfile stays readable. v2 no longer runs on current runner Node.
      uses: pnpm/action-setup@v6

    - name: Get pnpm store directory
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

    - name: Setup pnpm cache
      uses: actions/cache@v3
      with:
        path: ${{ env.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Run linting
      run: pnpm run lint

    - name: Run type checking
      run: pnpm run type-check

    - name: Run tests
      run: pnpm run test
      env:
        CI: true

    - name: Build packages
      # web is left out on purpose: its blog pages are statically generated from
      # Supabase, so `next build` needs working credentials and CI has none. Vercel
      # builds web on every PR with the real env, so that coverage is not lost here.
      # Everything else (api, workers and the shared packages) builds in CI.
      run: pnpm exec turbo run build --filter='!web'

  e2e:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20.x

    - name: Setup pnpm
      # No version pinned on purpose: the action reads `packageManager` from
      # package.json, so CI and everyone's machine install the same pnpm and the
      # lockfile stays readable. v2 no longer runs on current runner Node.
      uses: pnpm/action-setup@v6

    - name: Get pnpm store directory
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

    - name: Setup pnpm cache
      uses: actions/cache@v3
      with:
        path: ${{ env.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Run E2E tests
      run: pnpm run test:e2e
      env:
        CI: true

  security:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20.x

    - name: Setup pnpm
      # No version pinned on purpose: the action reads `packageManager` from
      # package.json, so CI and everyone's machine install the same pnpm and the
      # lockfile stays readable. v2 no longer runs on current runner Node.
      uses: pnpm/action-setup@v6

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Run security audit
      run: pnpm audit --audit-level moderate

    - name: Check for vulnerabilities
      run: |
        if pnpm audit --audit-level high; then
          echo "High severity vulnerabilities found!"
          exit 1
        fi
